name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_opennext:
        description: 'Deploy OpenNext (CloudFront + Lambda) — production dashboard'
        required: false
        type: boolean
        default: true
      deploy_ecs:
        description: 'Deploy legacy ECS/Fargate dashboard (rollback only)'
        required: false
        type: boolean
        default: false
      rebuild_intelligence:
        description: 'Rebuild intelligence dashboard artifacts on S3'
        required: false
        type: boolean
        default: false

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: pfrs-lab-dashboard

permissions:
  id-token: write
  contents: write

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: platform/go/go.sum

      - name: Run tests
        working-directory: platform/go
        run: go test ./... -count=1 -short -timeout 120s

  test-web:
    name: Dashboard Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: platform/web/pfrs-lab
        run: npm install

      - name: Run tests
        working-directory: platform/web/pfrs-lab
        run: npm run test:ci

      - name: Build
        working-directory: platform/web/pfrs-lab
        run: npx next build

      - name: Run E2E smoke tests
        working-directory: platform/web/pfrs-lab
        env:
          STORAGE_PROVIDER: local
        run: |
          npm run start &
          npx wait-on http://localhost:3000 --timeout 30000
          npx cypress run --spec 'cypress/e2e/structure.cy.ts'
          kill %1 || true

  release:
    name: Semantic Release
    needs: [test-go, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      new_release: ${{ steps.release.outputs.new_release_published }}
      version: ${{ steps.release.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run semantic-release
        id: release
        uses: cycjimmy/semantic-release-action@v4
        with:
          extra_plugins: |
            @semantic-release/changelog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-opennext:
    name: Deploy Dashboard (OpenNext)
    needs: [release]
    if: needs.release.outputs.new_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install & deploy OpenNext (SST)
        working-directory: platform/web/pfrs-lab
        env:
          PFRS_S3_BUCKET: pfrs-research-lab-data
          COGNITO_USER_POOL_ID: eu-west-1_J3FLcGW6P
          COGNITO_CLIENT_ID: dnjtkgqomiq15if0519nalgp4
          PFRS_ADMIN_MODE: authenticated
          NEXT_PUBLIC_ADMIN_MODE: authenticated
          STORAGE_PROVIDER: local
          DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL_ID: ${{ vars.ANTHROPIC_MODEL_ID }}
        run: |
          npm install
          npx sst deploy --stage production

      - name: Output
        run: echo "OpenNext dashboard deployed (see SST outputs for CloudFront URL)."

  deploy-opennext-manual:
    name: Deploy Dashboard (OpenNext, manual)
    needs: [test-web]
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_opennext == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install & deploy OpenNext (SST)
        working-directory: platform/web/pfrs-lab
        env:
          PFRS_S3_BUCKET: pfrs-research-lab-data
          COGNITO_USER_POOL_ID: eu-west-1_J3FLcGW6P
          COGNITO_CLIENT_ID: dnjtkgqomiq15if0519nalgp4
          PFRS_ADMIN_MODE: authenticated
          NEXT_PUBLIC_ADMIN_MODE: authenticated
          STORAGE_PROVIDER: local
          DASHBOARD_DOMAIN: ${{ vars.DASHBOARD_DOMAIN }}
          LLM_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ANTHROPIC_MODEL_ID: ${{ vars.ANTHROPIC_MODEL_ID }}
        run: |
          npm install
          npx sst deploy --stage production

  deploy-ecs-legacy:
    name: Deploy Dashboard (ECS legacy)
    needs: [test-web]
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.deploy_ecs == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: platform/web/pfrs-lab
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          VERSION: manual-${{ github.run_number }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:manual-${{ github.run_number }} .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:manual-${{ github.run_number }} $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:manual-${{ github.run_number }}
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      - name: Force ECS deployment
        run: |
          SERVICE_ARN=$(aws cloudformation describe-stacks --stack-name PfrsDashboardStack \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceArn'].OutputValue" --output text --region eu-west-1)
          if [ -z "$SERVICE_ARN" ] || [ "$SERVICE_ARN" = "None" ]; then
            echo "ECS not enabled on PfrsDashboardStack (enableEcsDashboard=false). Skipping."
            exit 0
          fi
          CLUSTER=$(echo "$SERVICE_ARN" | cut -d'/' -f2)
          SERVICE=$(echo "$SERVICE_ARN" | cut -d'/' -f3)
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --force-new-deployment --region eu-west-1

      - name: Output
        run: echo "Legacy ECS manual deploy complete (rollback path only)."

  rebuild-intelligence:
    name: Rebuild Intelligence Artifacts
    needs: [test-web]
    if: >
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.rebuild_intelligence == 'true' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install dependencies
        working-directory: platform/web/pfrs-lab
        run: npm install

      - name: Rebuild intelligence artifacts on S3
        working-directory: platform/web/pfrs-lab
        env:
          STORAGE_PROVIDER: s3
          PFRS_S3_BUCKET: pfrs-research-lab-data
        run: npm run rebuild-intelligence
