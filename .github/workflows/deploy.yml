name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: pfrs-lab-dashboard

permissions:
  id-token: write
  contents: read

jobs:
  test-go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run tests
        working-directory: platform/go
        run: go test ./... -count=1 -timeout 120s

  test-web:
    name: Dashboard Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: platform/web/pfrs-lab/package-lock.json

      - name: Install dependencies
        working-directory: platform/web/pfrs-lab
        run: npm ci

      - name: Run tests
        working-directory: platform/web/pfrs-lab
        run: npm run test:ci

      - name: Build
        working-directory: platform/web/pfrs-lab
        run: npx next build

  deploy:
    name: Deploy Dashboard
    needs: [test-go, test-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image
        working-directory: platform/web/pfrs-lab
        env:
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

      # App Runner auto-deploys on ECR push (configured in CDK).
      # No additional deploy step needed.

      - name: Output
        run: echo "Deployed ${{ github.sha }} to ECR. App Runner will auto-deploy."
